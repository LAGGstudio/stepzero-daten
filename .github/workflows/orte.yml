name: Orte holen und veröffentlichen

on:
  schedule:
    # montags 03:23 UTC: eine krumme Minute, weil GitHub zur vollen Stunde
    # unter Last Läufe verzögert oder verwirft (seit dem 12.11.2026, vorher
    # 03:00).
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      quelle:
        description: 'Quelle der Orte (overpass nur für einen Handstart)'
        type: choice
        options: [geofabrik, overpass]
        default: geofabrik
      fehlerprobe:
        description: 'Rote Probe: scheitert vor jedem Abruf und jeder Veröffentlichung (legt das Issue an)'
        type: boolean
        default: false

# Für bauen und veroeffentlichen; stand und melden setzen eigene, engere Rechte.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-24.04
    outputs:
      stand: ${{ steps.stand.outputs.stand }}
    steps:
      - name: Rote Probe (nur von Hand mit fehlerprobe)
        if: ${{ inputs.fehlerprobe }}
        run: |
          echo "::error::Rote Probe: Der Lauf scheitert absichtlich vor jedem Abruf und jeder Veröffentlichung."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: pyosmium für den Geofabrik-Auszug
        # Die Version des letzten grünen Laufs (42780352071: osmium-4.3.2).
        run: python3 -m pip install 'osmium==4.3.*'
      - name: Orte holen (Geofabrik-Auszug, von Hand auch Overpass)
        env:
          # Geltende Quelle seit dem 10.11.2026; zeitgesteuert gibt es keine
          # Eingaben, dann gilt geofabrik.
          ORTE_QUELLE: ${{ inputs.quelle || 'geofabrik' }}
        run: python3 tools/hole_orte.py ausgabe
      - name: Prüfen gegen die veröffentlichte Fassung
        run: python3 tools/pruefe_orte.py ausgabe "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Stand für stand.json
        id: stand
        env:
          ORTE_QUELLE: ${{ inputs.quelle || 'geofabrik' }}
        run: python3 tools/stand.py ausgabe >> "$GITHUB_OUTPUT"
      - name: Übersichtsseite
        run: python3 tools/seite_bauen.py ausgabe
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ausgabe

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Erst nach der Veröffentlichung: stand.json auf main (Laufdatum, Stand,
  # Einträge je Land), zugleich Aktivität gegen die 60-Tage-Regel.
  stand:
    needs: [bauen, veroeffentlichen]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: stand.json committen
        env:
          STAND: ${{ needs.bauen.outputs.stand }}
        run: |
          python3 tools/stand.py --schreiben stand.json
          git add stand.json
          if git diff --cached --quiet; then
            echo "stand.json unverändert, kein Commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Stand vom $(date -u +%Y-%m-%d): $(python3 tools/stand.py --kurz stand.json)"
          git pull --rebase origin main
          git push origin HEAD:main

  # Scheitert irgendein Job: ein Issue mit dem Label lauf-gescheitert, oder
  # ein Kommentar, wenn schon eins offen ist.
  melden:
    needs: [bauen, veroeffentlichen, stand]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ANLASS: ${{ github.event_name }}
    steps:
      - name: Issue anlegen oder kommentieren
        run: |
          gh label create lauf-gescheitert --color B60205 --description 'Ein Lauf von orte.yml ist gescheitert' --force
          text="Lauf gescheitert ($ANLASS, $(date -u +'%Y-%m-%d %H:%M') UTC): $LAUF

          Online bleibt die zuletzt veröffentlichte Fassung. Weitere gescheiterte Läufe kommen als Kommentar dazu, bis dieses Issue geschlossen ist."
          nummer=$(gh issue list --label lauf-gescheitert --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$nummer" ]; then
            gh issue comment "$nummer" --body "$text"
          else
            gh issue create --title 'Orte: Lauf gescheitert' --label lauf-gescheitert --body "$text"
          fi
