name: Orte holen und veröffentlichen

on:
  schedule:
    - cron: '0 3 * * 1'   # montags 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: pyosmium für den Rückfall auf Geofabrik
        run: python3 -m pip install osmium
      - name: Orte holen (Overpass, sonst Geofabrik-Auszug)
        run: python3 tools/hole_orte.py ausgabe
      - name: Prüfen gegen die veröffentlichte Fassung
        run: python3 tools/pruefe_orte.py ausgabe "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Übersichtsseite
        run: python3 tools/seite_bauen.py ausgabe
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ausgabe

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
